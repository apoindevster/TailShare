name: Checks and GitHub Pages

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      relay_tests:
        description: Run real Tailcat transfers against public DERP relays (synthetic files only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: transport/go.mod
          cache-dependency-path: transport/go.sum
      - name: Scan source for secrets and personal paths
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 dir --redact --no-banner --ignore-gitleaks-allow --max-decode-depth 2 --config .gitleaks.toml .
      - run: npm ci
      - run: npm test
      - run: npm run test:go
      - name: Compile Tailcat WASM and build static assets
        run: npm run build
      - name: Verify deployment bundle
        run: npm run check:dist
      - name: Scan production assets
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 dir --redact --no-banner --ignore-gitleaks-allow --max-decode-depth 2 --max-archive-depth 2 --config .gitleaks.toml dist
      - name: Scan strings embedded in compiled WASM
        shell: bash
        run: gzip -dc dist/transport/tailcat-*.wasm.gz | strings | go run github.com/zricethezav/gitleaks/v8@v8.30.1 stdin --redact --no-banner --ignore-gitleaks-allow --max-decode-depth 2 --config .gitleaks.toml
      - name: Install browser test dependencies
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Build pinned CLI for interoperability tests
        if: github.event_name == 'workflow_dispatch' && inputs.relay_tests
        run: npm run build:test-cli
      - name: Test production site across browsers
        run: npm run test:e2e
        env:
          TAILSHARE_NETWORK: ${{ github.event_name == 'workflow_dispatch' && inputs.relay_tests && '1' || '0' }}
      - name: Save failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-test-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload verified Pages site
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
